name: Sentry release
description: >-
  Creates a Sentry release for the self-hosted Sentry instance at
  sentry.hyperfluid.dev. Supports both GitHub-hosted runners (via Cloudflare
  Access service tokens) and self-hosted homelab runners on the internal
  network.
  Authored in the private munhall repo and published here by publish-ci-library.yml;
  edit it upstream.

inputs:
  project:
    required: true
    description: Sentry project slug (must match the project in the Sentry UI).
  version:
    required: true
    description: >-
      Release version. Typically the release-please tag_name (e.g.,
      "walkingpad-bridge-v0.3.1") or a git tag.
  environment:
    required: false
    default: production
    description: Sentry environment (production, staging, dev).
  sourcemaps-dir:
    required: false
    default: ''
    description: >-
      Directory containing sourcemaps to upload. Leave empty to skip
      sourcemap upload (e.g., for Python services).
  sourcemaps-url-prefix:
    required: false
    default: '~/'
    description: >-
      URL prefix where the JS bundles are served at runtime. Must match
      stack trace frame URLs or symbolication fails silently.
  cf-access-client-id:
    required: false
    default: ''
    description: >-
      Cloudflare Access service token client ID. Required when running on a
      GitHub-hosted runner or any runner that doesn't have split-DNS to the
      internal Sentry tunnel ingress. Omit on homelab runners with direct
      LAN access.
  cf-access-client-secret:
    required: false
    default: ''
    description: Companion to cf-access-client-id. Mark as a workflow secret.
  sentry-url:
    required: false
    default: https://sentry.hyperfluid.dev/
    description: >-
      Sentry management URL. The SDK ingestion relay
      (relay.hyperfluid.dev) does NOT serve the management API, so
      sentry-cli must hit the canonical hostname.
  sentry-org:
    required: false
    default: hfs
    description: >-
      Sentry organization slug. The self-hosted instance's org is `hfs` (not
      "hyperfluid" — a wrong slug surfaces as a misleading "Project not found").

runs:
  using: composite
  steps:
    # Inputs reach the shell through env:, never ${{ }} inside run: — an inlined
    # value is spliced into the script text before bash parses it.
    - name: Validate environment
      shell: bash
      env:
        CF_ID: ${{ inputs.cf-access-client-id }}
        CF_SECRET: ${{ inputs.cf-access-client-secret }}
      run: |
        if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
          echo "::error::SENTRY_AUTH_TOKEN env var is required (set it in the calling job's env: block from secrets)"
          exit 1
        fi
        if [ -n "$CF_ID" ] && [ -z "$CF_SECRET" ]; then
          echo "::error::cf-access-client-id set but cf-access-client-secret is empty"
          exit 1
        fi
        if [ -z "$CF_ID" ] && [ -n "$CF_SECRET" ]; then
          echo "::error::cf-access-client-secret set but cf-access-client-id is empty"
          exit 1
        fi
        # Service-token IDs and secrets are hex (the ID ends in .access). Anything
        # else is a wrong secret — and a newline would inject lines into GITHUB_ENV.
        for v in "$CF_ID" "$CF_SECRET"; do
          if [ -n "$v" ] && ! [[ "$v" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::cf-access-client-id/secret contains unexpected characters — check the secret values"
            exit 1
          fi
        done

    - name: Configure Cloudflare Access header
      shell: bash
      env:
        CF_ID: ${{ inputs.cf-access-client-id }}
        CF_SECRET: ${{ inputs.cf-access-client-secret }}
      run: |
        if [ -z "$CF_ID" ]; then
          echo "Cloudflare Access header skipped (assuming internal-network runner)"
          exit 0
        fi
        # sentry-cli sends exactly ONE custom header taken from the environment
        # (CUSTOM_HEADER, "Name:value"); it has no SENTRY_HEADER_* support, and
        # multiple headers need repeated --header flags, which action-release cannot
        # pass. So the Sentry Access app accepts the service token as a single JSON
        # header (read_service_tokens_from_header in systems/network/iac/main.tf)
        # instead of the CF-Access-Client-Id / CF-Access-Client-Secret pair.
        token_json=$(printf '{"cf-access-client-id":"%s","cf-access-client-secret":"%s"}' "$CF_ID" "$CF_SECRET")
        echo "::add-mask::$token_json"
        echo "CUSTOM_HEADER=cf-access-token:$token_json" >> "$GITHUB_ENV"
        echo "Cloudflare Access service-token header enabled"

    - name: Create Sentry release
      uses: getsentry/action-release@v3
      with:
        environment: ${{ inputs.environment }}
        version: ${{ inputs.version }}
        projects: ${{ inputs.project }}
        sourcemaps: ${{ inputs.sourcemaps-dir }}
        url_prefix: ${{ inputs.sourcemaps-url-prefix }}
      env:
        SENTRY_ORG: ${{ inputs.sentry-org }}
        SENTRY_URL: ${{ inputs.sentry-url }}
